; Absolute Power 0.1.0-alpha shipped defaults.
; User edits belong in AbsolutePower_Custom.ini. Absolute Workbench owns that file.

[General]
bEnableLog=true
sStartupPreset=Balanced
; Automated event-driven reallocation changes vanilla power-management balance.
; It is intentionally off by default and surfaced as Automation / Cheats.
bAutomationEnabled=false

; Each system value is Green,Yellow,Red pip counts. Counts are portable across
; ships: a preset is clipped to the installed system maximum at runtime.
; Within a tier, Order is the deterministic round-robin tie breaker.

[Preset.Balanced]
Name=Balanced
Order=Shield,Engine,Weapon0,Weapon1,Weapon2,GravDrive
Weapon0=1,2,2
Weapon1=1,2,2
Weapon2=1,2,2
Engine=2,2,4
Shield=2,2,4
GravDrive=0,0,8

[Preset.Combat]
Name=Combat
Order=Shield,Engine,Weapon0,Weapon1,Weapon2,GravDrive
Weapon0=2,3,3
Weapon1=2,3,3
Weapon2=2,3,3
Engine=2,3,3
Shield=3,3,4
GravDrive=0,0,8

[Preset.Travel]
Name=Travel
Order=Engine,Shield,GravDrive,Weapon0,Weapon1,Weapon2
Weapon0=0,1,3
Weapon1=0,1,3
Weapon2=0,1,3
Engine=4,4,4
Shield=2,2,4
GravDrive=0,4,8

; ---------------------------------------------------------------------------
; Automation / Cheats examples. Every rule and the global switch must be on.
; TargetPips accepts an integer or Max. Priority resolves competing emergency
; demands before the normal Green tier. Larger numbers win.

[Rule.FiredWeapon1]
Name=Power Weapon 1 while firing
Enabled=false
Trigger=WeaponFired
Source=Weapon0
Target=Weapon0
TargetPips=Max
HoldMilliseconds=1200
Priority=200

[Rule.IncomingFire]
Name=Max shields after incoming damage
Enabled=false
Trigger=IncomingDamage
Source=Any
Target=Shield
TargetPips=Max
HoldMilliseconds=2500
Priority=300

[Rule.HighThrottle]
Name=Max engines above 50% throttle
Enabled=false
Trigger=ThrottleAbove
Source=Any
Target=Engine
TargetPips=Max
ThresholdPercent=50
HysteresisPercent=5
HoldMilliseconds=0
Priority=150
